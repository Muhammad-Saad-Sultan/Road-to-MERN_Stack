<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Javascript</title>
</head>
<body>
    <h1>To-Do List</h1>
    <div class="todo-list">
        <form action="#">
            <label for="task-name">Task Name:
                <input type="text" name="task-name" id="task-name" placeholder="Add a task">
            </label>
            <button type="button" class="green" id="add">Add</button>
        </form>
        <div class="details">
            <p>Completed Tasks: <span class="complete">0</span></p>
            <p>Incomplete Tasks: <span class="incomplete">0</span></p>
        </div>
        <div class="header">
            <p>Task name</p>
            <p>Actions</p>
        </div>
        <ul></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
