<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Refactored Pokemon Search</title>
</head>
<body>
    <h1>Refactored Pokemon Search</h1>

    <section>
        <h2>1. Search Pokemon</h2>
        <input type="text" id="pokemonInput" placeholder="Enter Pokemon name">
        <button id="searchButton">Search</button>
        <p id="pokemonLoading"></p>
        <p id="pokemonError" class="error"></p>
        <div id="pokemonResult" class="pokemon-info"></div>
    </section>

    <script type="module" src="main.js"></script>
</body>
</html>
